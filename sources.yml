# Public, no-auth-required threat intelligence feeds.
# Note: ACSC does not publish a plain-text public IOC feed. Their indicator
# sharing is done via the CTIS (Cyber Threat Intelligence Sharing) platform,
# a TAXII 2.1 server requiring partner onboarding and credentials — not a
# simple URL fetch. See: https://www.cyber.gov.au (Partnership Portal / CTIS)

ip_sources:
  - name: feodotracker
    url: https://feodotracker.abuse.ch/downloads/ipblocklist.txt
  - name: spamhaus_drop
    url: https://www.spamhaus.org/drop/drop.txt
  - name: spamhaus_edrop
    url: https://www.spamhaus.org/drop/edrop.txt
  - name: emerging_threats_compromised
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
  - name: cins_army
    url: https://cinsscore.com/list/ci-badguys.txt
  - name: blocklist_de_all
    url: https://lists.blocklist.de/lists/all.txt
  - name: threatfox_ip_recommended
    url: https://threatfox.abuse.ch/downloads/ipblocklist_recommended.txt
  - name: alienvault_reputation
    url: http://reputation.alienvault.com/reputation.data

domain_sources:
  - name: urlhaus
    url: https://urlhaus.abuse.ch/downloads/text/
  - name: botvrij_hostnames
    url: https://www.botvrij.eu/data/ioclist.hostname.raw
